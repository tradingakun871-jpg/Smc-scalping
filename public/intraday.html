<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Intraday — Web1 SMC</title><style>*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e8eef8;font:14px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:22px}a{color:#93c5fd}.brand{font-size:24px;font-weight:800}.brand b{color:#4ade80}.muted{color:#91a5bf}.card{background:#101c2e;border:1px solid #24364c;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.value{font-size:24px;font-weight:800;margin-top:7px}.buy{color:#4ade80}.sell{color:#fb7185}.pending{color:#fbbf24}.small{font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #24364c;white-space:nowrap}th{color:#91a5bf}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 Arial}button{background:#24364c;border:0;color:white;padding:9px 14px;border-radius:8px;cursor:pointer}</style></head><body><main class="wrap"><div class="nav"><a href="/">← Scalping</a><a href="/swing.html">Swing</a><div class="brand"><b>AI SMC</b> INTRADAY</div><span class="muted">SIGNAL ONLY • Tanpa auto order</span></div><p class="muted">D1 Context → H4 Direction → H1 Trigger → M15 Confirmation → M5 Execution. Sesi Asia / London / New York. Waktu WIB.</p><section class="card"><div class="muted">Keputusan sesi terbaru</div><div id="latest" class="value">Memuat…</div><div id="detail" class="muted"></div><div class="grid" id="levels"></div><p id="reason" class="muted"></p><div id="updated" class="small muted"></div></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Riwayat Sinyal Intraday</h3><button onclick="refresh()">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Waktu WIB</th><th>Sesi</th><th>Keputusan</th><th>Status</th><th>Entry</th><th>SL</th><th>TP1</th><th>TP2</th></tr></thead><tbody id="history"><tr><td colspan="8">Memuat…</td></tr></tbody></table></div></section></main><script>
const el=id=>document.getElementById(id),fmt=v=>v==null?'—':Number.isFinite(Number(v))?Number(v).toFixed(2):String(v),wib=t=>t?new Date(t).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'short',timeStyle:'medium'}):'—';
function cell(t){const e=document.createElement('td');e.textContent=t;return e}
async function refresh(){try{const res=await fetch('/api/intraday/status',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json(),h=Array.isArray(data.history)?data.history:[];el('history').replaceChildren();if(!h.length){const tr=document.createElement('tr'),td=cell('Belum ada keputusan sesi yang tersimpan');td.colSpan=8;tr.append(td);el('history').append(tr);el('latest').textContent='MENUNGGU ANALISIS';el('levels').replaceChildren();el('reason').textContent='';return;}const x=h[0],p=x.payload||{};el('latest').textContent=x.decision+' • '+x.status;el('latest').className='value '+(x.decision==='BUY'?'buy':x.decision==='SELL'?'sell':'pending');el('detail').textContent=x.session+' • '+wib(x.created_at);el('levels').replaceChildren();for(const [label,v] of [['Entry',p.entry],['Stop Loss',p.stopLoss],['TP1 (1R)',p.tp1],['TP2 (2R)',p.tp2],['Confidence',p.confidence!=null?p.confidence+'%':null]]){const box=document.createElement('div');box.className='card';const name=document.createElement('div');name.className='muted';name.textContent=label;const value=document.createElement('div');value.className='value';value.textContent=fmt(v);box.append(name,value);el('levels').append(box)}el('reason').textContent=p.reason||'—';for(const row of h){const tr=document.createElement('tr');for(const v of [wib(row.created_at),row.session,row.decision,row.status,fmt(row.payload?.entry),fmt(row.payload?.stopLoss),fmt(row.payload?.tp1),fmt(row.payload?.tp2)])tr.append(cell(v));el('history').append(tr)}el('updated').textContent='Pembaruan: '+wib(new Date().toISOString());}catch(e){el('latest').textContent='GAGAL MEMUAT';el('reason').textContent=e.message;}}
refresh();setInterval(refresh,10000);
</script></body></html>
